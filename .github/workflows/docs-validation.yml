name: Documentation Validation

on:
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - 'docs/**'
      - '.github/workflows/docs-validation.yml'
  pull_request:
    paths:
      - AGENTS.md
      - 'docs/**'
      - '.github/workflows/docs-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate-docs:
    name: Validate engineering and UX documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run documentation validators
        id: validator
        shell: bash
        run: |
          set +e

          python docs/scripts/validate_docs.py > engineering-validation-output.txt 2>&1
          engineering_status=$?

          python docs/ux/scripts/validate_ux_docs.py --phase 4 > ux-validation-output.txt 2>&1
          ux_status=$?

          {
            echo '=== Engineering documentation ==='
            cat engineering-validation-output.txt
            echo
            echo '=== UX Phase 4 ==='
            cat ux-validation-output.txt
          } | tee validation-output.txt

          status=0
          if [ "$engineering_status" -ne 0 ] || [ "$ux_status" -ne 0 ]; then
            status=1
          fi

          echo "engineering_status=$engineering_status" >> "$GITHUB_OUTPUT"
          echo "ux_status=$ux_status" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish validation report issue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATOR_STATUS: ${{ steps.validator.outputs.status }}
          ENGINEERING_STATUS: ${{ steps.validator.outputs.engineering_status }}
          UX_STATUS: ${{ steps.validator.outputs.ux_status }}
        shell: bash
        run: |
          {
            echo '# Documentation Validation Report'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Combined exit code: \`$VALIDATOR_STATUS\`"
            echo "- Engineering validator: \`$ENGINEERING_STATUS\`"
            echo "- UX Phase 4 validator: \`$UX_STATUS\`"
            echo "- Workflow: \`Documentation Validation\`"
            echo
            echo '```text'
            cat validation-output.txt
            echo '```'
          } > issue-body.md

          issue_number=$(gh issue list \
            --state all \
            --search 'Documentation Validation Report in:title' \
            --json number,title \
            --jq '.[] | select(.title == "Documentation Validation Report") | .number' \
            | head -n 1)

          if [ -z "$issue_number" ]; then
            gh issue create \
              --title 'Documentation Validation Report' \
              --body-file issue-body.md >/dev/null
          else
            gh issue edit "$issue_number" --body-file issue-body.md >/dev/null
            gh issue reopen "$issue_number" >/dev/null 2>&1 || true
          fi

      - name: Fail when documentation validation fails
        if: steps.validator.outputs.status != '0'
        run: exit 1
