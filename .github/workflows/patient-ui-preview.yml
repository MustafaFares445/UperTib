name: Patient UI Preview

on:
  pull_request:
    paths:
      - 'tools/patient-ui-preview/**'
      - '.claude/skills/patient-ui-preview/SKILL.md'
      - '.github/workflows/patient-ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify Storybook preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/patient-ui-preview

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install preview dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Commit generated dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock Patient UI preview dependencies"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Capture npm audit report
        shell: bash
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit.json || true
          npm audit --omit=dev --audit-level=high

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: patient-ui-preview-package-lock
          path: tools/patient-ui-preview/package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build Storybook
        run: npm run storybook:build

      - name: Run readiness smoke test
        run: npm run test:smoke

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-ui-preview-playwright
          path: tools/patient-ui-preview/artifacts/
          if-no-files-found: ignore
          retention-days: 7
