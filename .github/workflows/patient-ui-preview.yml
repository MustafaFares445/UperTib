name: Patient UI Preview

on:
  push:
    branches:
      - main
    paths:
      - 'tools/patient-ui-preview/**'
      - 'docs/ux/02-wireframes/wireframe-manifest.json'
      - '.claude/skills/patient-ui-preview/SKILL.md'
      - '.github/workflows/patient-ui-preview.yml'
  pull_request:
    paths:
      - 'tools/patient-ui-preview/**'
      - 'docs/ux/02-wireframes/wireframe-manifest.json'
      - '.claude/skills/patient-ui-preview/SKILL.md'
      - '.github/workflows/patient-ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Storybook preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/patient-ui-preview

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/patient-ui-preview/package-lock.json

      - name: Install preview dependencies
        run: npm ci

      - name: Audit dependencies
        shell: bash
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit.json || true
          npm audit --omit=dev --audit-level=high

      - name: Validate documentation integrity
        working-directory: .
        run: python3 docs/scripts/validate_docs.py

      - name: Check changed lines for whitespace errors
        working-directory: .
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check
          fi

      - name: Test canonical Patient screen coverage validator
        run: npm run test:screen-coverage-validator

      - name: Audit canonical Patient screen coverage
        run: npm run screen-coverage

      - name: Test native evidence validator
        run: npm run test:native-evidence-validator

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build Storybook
        run: npm run storybook:build

      - name: Run readiness smoke test
        run: npm run test:smoke

      - name: Run full Patient E2E suite
        run: npx playwright test

      - name: Capture all-slices visual evidence at 320 / 390 / 414
        run: npm run capture:all:ci

      - name: Upload authoritative audit JSON separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-ui-preview-authoritative-audit-json
          path: tools/patient-ui-preview/artifacts/final-approval/audit-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright, visual-review, and audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patient-ui-preview-artifacts
          path: tools/patient-ui-preview/artifacts/
          if-no-files-found: ignore
          retention-days: 7
